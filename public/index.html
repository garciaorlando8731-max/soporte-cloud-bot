<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte Técnico Cloud - Emergencias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      🛠️ Centro de Soporte Cloud de la Plataforma Escolar
    </div>

    <div id="chatMessages" class="chat-messages">
      <div class="message bot-msg">
        👋 Hola. Si la plataforma escolar presenta fallas o caídas imprevistas, escribe tu problema aquí para recibir asistencia automática.
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Ej: La plataforma se cayó..." autofocus>
      <button id="btnEnviar" type="button">Enviar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
